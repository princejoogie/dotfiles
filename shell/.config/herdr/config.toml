onboarding = false

[ui]
pane_gaps = false

show_agent_labels_on_pane_borders = false
[keys]
prefix = "ctrl+a"

# Match tmux's window and split creation bindings.
new_tab = "prefix+c"
split_vertical = "prefix+backslash"
split_horizontal = "prefix+="
last_pane = "prefix+l"

# Treat Herdr spaces like tmux sessions managed by tms.
workspace_picker = "prefix+s"
settings = "prefix+comma"
goto = "prefix+shift+p"
new_workspace = "prefix+shift+n"
previous_workspace = "cmd+k"
next_workspace = "cmd+j"
switch_tab = ["prefix+1..9", "cmd+1..9"]
rename_pane = ""
navigate_workspace_up = ["k", "up"]
navigate_workspace_down = ["j", "down"]
navigate_pane_up = "shift+k"
navigate_pane_down = "shift+j"
previous_agent = "prefix+{"
next_agent = "prefix+}"

# Open worktrees as spaces; keep the displaced sidebar action available.
open_worktree = "prefix+b"
toggle_sidebar = "cmd+b"

# Keep prefix-based pane movement as a fallback. Direct Ctrl+h/j/k/l bindings
# below forward into Neovim and move Herdr panes for other processes.
focus_pane_left = "prefix+shift+h"
focus_pane_down = "prefix+shift+j"
focus_pane_up = "prefix+shift+k"
focus_pane_right = "prefix+shift+l"

# tmux uses prefix+r to reload; resizing stays on direct ctrl+arrow bindings below.
reload_config = "prefix+r"
resize_mode = ""

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = 'herdr_navigate left'
description = "navigate left across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = 'herdr_navigate down'
description = "navigate down across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = 'herdr_navigate up'
description = "navigate up across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = 'herdr_navigate right'
description = "navigate right across Neovim and Herdr panes"

[[keys.command]]
key = "ctrl+left"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction left'
description = "resize pane left"

[[keys.command]]
key = "ctrl+down"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction down'
description = "resize pane down"

[[keys.command]]
key = "ctrl+up"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction up'
description = "resize pane up"

[[keys.command]]
key = "ctrl+right"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --pane "$HERDR_ACTIVE_PANE_ID" --direction right'
description = "resize pane right"

[[keys.command]]
key = "prefix+cmd+b"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin official.browser --entrypoint browser --placement split --target-pane "$HERDR_ACTIVE_PANE_ID" --direction right --focus && "$HERDR_BIN_PATH" pane close "$HERDR_ACTIVE_PANE_ID"'
description = "replace current pane with browser"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "princejoogie.repo-picker.open"
description = "open repository as a workspace"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = 'tab=$($HERDR_BIN_PATH tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HERDR_ACTIVE_PANE_CWD" --focus) && pane=$(printf "%s" "$tab" | jq -r ".result.root_pane.pane_id") && "$HERDR_BIN_PATH" pane run "$pane" nd'
description = "open Diffview in a new tab"

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true

[worktrees]
directory = "~/.worktrees"

[[worktrees.hooks.after_create]]
command = ["sh", "-c", "if [ -f scripts/setup-worktree.sh ]; then bash scripts/setup-worktree.sh; fi"]

[theme]
name = "vesper"
auto_switch = false

# opencode-black, adapted from ~/.config/opencode/themes/opencode-black.json.
[theme.custom]
accent = "#fab283"
panel_bg = "#1e1e1e"
sidebar_bg = "#141414"
surface0 = "#282828"
surface1 = "#323232"
surface_dim = "#141414"
overlay0 = "#808080"
overlay1 = "#a0a0a0"
text = "#eeeeee"
subtext0 = "#a0a0a0"
mauve = "#9d7cd8"
green = "#7fd88f"
yellow = "#e5c07b"
red = "#e06c75"
blue = "#5c9cf5"
teal = "#56b6c2"
peach = "#f5a742"
